name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Bare `node --test`, never `node --test tests/` — on Node 24 the path
      # form resolves the directory as a module instead of globbing it.
      - run: node --test
